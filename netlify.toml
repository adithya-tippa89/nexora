# Netlify Configuration for SkillSync Maharashtra
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Single-Page Application (SPA) redirect rule
# Ensures React Router handles all routes without 404 on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
